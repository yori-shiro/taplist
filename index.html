<title>かいものリスト</title>
<style>
:root{
  --paper:#F2F3F0;
  --surface:#FFFFFF;
  --ink:#1C211E;
  --muted:#6B7370;
  --faint:#9AA09B;
  --line:#DFE2DC;
  --accent:#2F6B5E;
  --accent-soft:#E6EEEA;
  --now:#B4451F;
  --now-soft:#F7E9E2;
  --warn:#8A6A1F;
  --warn-soft:#F5F0E2;
  --someday:#8A8F88;
  --radius:10px;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
input,select{font-family:inherit;font-size:16px;color:inherit;}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.tabs{display:flex;}
.tab{
  flex:1;height:var(--tap);
  font-size:14px;font-weight:600;letter-spacing:.06em;
  color:var(--muted);
  border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);}

main{max-width:600px;margin:0 auto;padding:0 14px;}
.screen{display:none;}
.screen.active{display:block;}

/* ---------- search ---------- */
.search-wrap{position:relative;margin:14px 0 0;}
#search{
  width:100%;height:48px;
  padding:0 40px 0 14px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  outline:none;
}
#search:focus{border-color:var(--accent);}
#search-clear{
  position:absolute;right:4px;top:4px;
  width:40px;height:40px;color:var(--faint);font-size:20px;
  display:none;
}
#search-clear.show{display:block;}

#suggestions{margin-top:6px;}
#suggestions:empty{display:none;}
.sug{
  display:flex;align-items:center;gap:10px;
  width:100%;min-height:var(--tap);
  padding:8px 14px;text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  border-bottom:none;
}
.sug:first-child{border-radius:var(--radius) var(--radius) 0 0;}
.sug:last-child{border-bottom:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);}
.sug:only-child{border-radius:var(--radius);}
.sug-name{flex:1;}
.sug-cat{font-size:12px;color:var(--faint);}
.sug.in-list{color:var(--faint);}
.sug.new{color:var(--accent);font-weight:600;}

/* ---------- safari注意 ---------- */
.mode-note{
  margin-top:14px;padding:10px 12px;
  background:var(--warn-soft);
  border-left:3px solid var(--warn);
  border-radius:0 8px 8px 0;
  font-size:13px;line-height:1.7;color:var(--warn);
}
.mode-note b{font-weight:700;}

/* ---------- banner ---------- */
.banner{
  margin-top:14px;padding:12px 14px;
  background:var(--now-soft);
  border-radius:var(--radius);
}
.banner-text{font-size:14px;margin-bottom:10px;}
.banner-actions{display:flex;gap:8px;}
.banner-actions button{
  flex:1;height:38px;font-size:14px;font-weight:600;
  border-radius:8px;background:var(--surface);
  border:1px solid rgba(180,69,31,.3);color:var(--now);
}

/* ---------- sort toggle ---------- */
.toolbar{display:flex;align-items:center;justify-content:flex-end;margin:16px 0 8px;}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);}
.seg button{padding:0 12px;height:32px;font-size:13px;color:var(--muted);}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;}

/* ---------- groups & rows ---------- */
.group{margin-bottom:18px;}
.group-head{
  display:flex;align-items:baseline;gap:8px;
  font-size:12px;font-weight:700;letter-spacing:.1em;
  color:var(--muted);
  padding:0 2px 6px;
}
.group-head .count{font-weight:400;color:var(--faint);letter-spacing:0;}
.group.p-now .group-head{color:var(--now);}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.row{display:flex;align-items:stretch;min-height:var(--tap);border-top:1px solid var(--line);}
.row:first-child{border-top:none;}
.badge{
  width:58px;flex:none;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  color:var(--muted);
  border-right:1px solid var(--line);
}
.badge[data-p="now"]{color:var(--now);background:var(--now-soft);}
.badge[data-p="anytime"]{color:var(--accent);background:var(--accent-soft);}
.badge[data-p="someday"]{color:var(--someday);}
.row-name{
  flex:1;display:flex;align-items:center;gap:8px;
  padding:10px 8px 10px 12px;text-align:left;
  min-width:0;
}
.row-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-cat{font-size:11px;color:var(--faint);flex:none;}
.row.checked .row-label{text-decoration:line-through;color:var(--faint);}
.row.checked{background:#FAFBFA;}
.check{
  width:20px;height:20px;flex:none;border-radius:50%;
  border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:transparent;
}
.row.checked .check{background:var(--accent);border-color:var(--accent);color:#fff;}
.row-remove{width:40px;flex:none;color:var(--faint);font-size:17px;}

/* ---------- catalog ---------- */
.cat-row{display:flex;align-items:stretch;min-height:var(--tap);border-top:1px solid var(--line);}
.cat-row:first-child{border-top:none;}
.cat-toggle{
  flex:1;display:flex;align-items:center;gap:10px;
  padding:10px 8px 10px 12px;text-align:left;min-width:0;
}
.dot{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--line);}
.cat-row.in-list .dot{background:var(--accent);border-color:var(--accent);}
.cat-row.in-list .cat-label{font-weight:600;}
.cat-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-edit{width:44px;flex:none;color:var(--faint);font-size:15px;}

/* ---------- settings ---------- */
.sec{margin:20px 0;}
.sec-head{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);padding:0 2px 6px;}
.set-row{display:flex;align-items:center;min-height:var(--tap);border-top:1px solid var(--line);padding-left:12px;}
.set-row:first-child{border-top:none;}
.set-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{width:40px;height:40px;flex:none;color:var(--muted);font-size:15px;}
.icon-btn:disabled{color:#D5D8D3;}
.btn{
  display:block;width:100%;height:46px;margin-top:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  font-size:15px;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn.danger{color:var(--now);border-color:rgba(180,69,31,.3);}
.note{font-size:12px;color:var(--faint);margin-top:8px;padding:0 2px;line-height:1.6;}

/* ---------- empty ---------- */
.empty{
  padding:36px 20px;text-align:center;color:var(--faint);font-size:14px;line-height:1.9;
}

/* ---------- finish bar ---------- */
#finish{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 70%,rgba(242,243,240,0));
  display:none;
}
#finish.show{display:block;}
#finish button{
  display:block;width:100%;max-width:572px;margin:0 auto;height:52px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  border-radius:var(--radius);
}

/* ---------- dialog ---------- */
#overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(28,33,30,.4);
  display:none;align-items:flex-end;justify-content:center;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
#overlay.show{display:flex;}
.sheet{
  width:100%;max-width:420px;
  background:var(--surface);border-radius:14px;
  padding:18px 16px 16px;
}
.sheet h2{margin:0 0 6px;font-size:16px;}
.sheet p{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.7;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.field input,.field select{
  width:100%;height:44px;padding:0 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
}
.sheet .btn{margin-top:8px;}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:60;max-width:88%;
  background:var(--ink);color:#fff;
  font-size:14px;padding:10px 16px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}

:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
</style>
</head>
<body>

<header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="list" aria-selected="true">リスト</button>
    <button class="tab" role="tab" data-view="catalog" aria-selected="false">カタログ</button>
    <button class="tab" role="tab" data-view="settings" aria-selected="false">設定</button>
  </nav>
</header>

<main>
  <!-- ============ LIST ============ -->
  <section class="screen active" id="screen-list">
    <div id="mode-note"></div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="アイテム名を入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="search-clear" aria-label="入力を消す">×</button>
    </div>
    <div id="suggestions"></div>
    <div id="banner"></div>
    <div class="toolbar">
      <div class="seg" id="sort-seg">
        <button data-sort="priority" aria-pressed="true">優先度順</button>
        <button data-sort="category" aria-pressed="false">カテゴリ順</button>
      </div>
    </div>
    <div id="list-body"></div>
  </section>

  <!-- ============ CATALOG ============ -->
  <section class="screen" id="screen-catalog">
    <div id="catalog-body"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section class="screen" id="screen-settings">
    <div class="sec">
      <div class="sec-head">カテゴリ</div>
      <div class="rows" id="category-body"></div>
      <button class="btn" id="add-category">カテゴリを追加</button>
      <p class="note">並び順は、よく行く店の売り場を回る順にしておくと、リスト画面の「カテゴリ順」がそのまま店内の動線になる。</p>
    </div>
    <div class="sec">
      <div class="sec-head">データ</div>
      <button class="btn" id="export-json">JSONで書き出す</button>
      <button class="btn" id="export-csv">CSVで書き出す</button>
      <button class="btn danger" id="import-json">JSONを読み込む</button>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none">
      <p class="note">読み込むと現在のデータは置き換わる。端末をまたいで持ち運ぶときや、バックアップに使う。</p>
    </div>
    <div class="sec">
      <div class="sec-head">このアプリについて</div>
      <p class="note" id="about-note"></p>
    </div>
  </section>
</main>

<div id="finish"><button id="finish-btn"></button></div>
<div id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ================= constants ================= */
var KEY = 'shopping-list-app';
/* VERSION は保存データの形式。互換性の判定に使う（構造を変えたときだけ上げる）。
   APP_VERSION はアプリ自体の版。表示専用で、動作には一切関与しない。
   バグ報告を受けたときに、相手がどの版を使っているかを特定するためのもの。 */
var VERSION = 1;
var APP_VERSION = '1.0';
var APP_DATE = '2026-08-25';
var PRIORITIES = ['now','anytime','someday'];
var P_LABEL = {now:'すぐ', anytime:'ついで', someday:'機会'};
var P_FULL  = {now:'すぐ買う', anytime:'ついでに', someday:'機会があれば'};
var UNCAT = '未分類';

/* ================= state ================= */
var state = null;
var view = 'list';
var sortMode = 'priority';
var query = '';
var storageBlocked = false;

/* iOSでは、ホーム画面に追加したアプリとSafariで localStorage が別々になる。
   Safari側で開くとリストが空に見えるが、これをデータ消失と勘違いして
   バックアップを読み込むと、Safari側にだけ復元されて混乱が二重になる。
   そのため、Safariで開いていることを画面上で明示する。
   このアプリはホーム画面版での運用に限定する方針（DESIGN_NOTES 参照）。 */
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
var isStandalone = (navigator.standalone === true) ||
  !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
var browserMode = isIOS && !isStandalone;

/* ================= utils ================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function nowISO(){ return new Date().toISOString(); }
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function el(id){ return document.getElementById(id); }

var toastTimer = null;
function toast(msg){
  var t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ================= storage ================= */
/* 保存は必ずこの関数を通す。
   1キーにまとめて書き、書いた直後に読み直して照合する。
   照合が通るまで現在の state には触れない = 表示とデータがずれない。
   ただしこれはストレージ機構そのものの信頼性を保証するものではない。 */
function commit(next){
  var json;
  try { json = JSON.stringify(next); }
  catch(e){ toast('保存できなかった。表示は変わっていない。'); return false; }

  try {
    localStorage.setItem(KEY, json);
    if(localStorage.getItem(KEY) !== json){
      toast('保存できなかった。表示は変わっていない。');
      return false;
    }
  } catch(e){
    toast('保存できなかった。表示は変わっていない。');
    return false;
  }

  state = next;
  render();
  return true;
}

function seed(){
  var t = Date.now();
  return {
    version: VERSION,
    categories: [
      {id:'c'+(t+1), name:'食品',   order:0},
      {id:'c'+(t+2), name:'日用品', order:1},
      {id:'c'+(t+3), name:'その他', order:2}
    ],
    items: [],
    list: [],
    session: null
  };
}

function migrate(data){
  /* version < VERSION のデータをここで変換する。
     現時点では VERSION 1 のみなので変換は無い。 */
  data.version = VERSION;
  return data;
}

/* 外から入ってきたデータを、必ずこの関数で整える。
   起動時の読み込みと JSONインポートの両方がここを通る。
   バックアップだから信用できる、とは考えない。手編集や破損、
   古いバージョン由来のデータも入口になりうるため。 */
function normalize(data){
  var out = {version:VERSION, categories:[], items:[], list:[], session:null};
  var okCat = {}, okItem = {}, inList = {};

  (Array.isArray(data.categories) ? data.categories : []).forEach(function(c){
    if(!c || typeof c.name !== 'string' || !c.name.trim()) return;
    var id = (typeof c.id === 'string' && c.id) ? c.id : 'c'+uid();
    if(okCat[id]) return;                       /* id重複を排除 */
    okCat[id] = true;
    out.categories.push({
      id:id, name:c.name.trim(),
      order: (typeof c.order === 'number' && isFinite(c.order)) ? c.order : 9998
    });
  });
  out.categories.sort(function(a,b){ return a.order - b.order; })
    .forEach(function(c,i){ c.order = i; });    /* orderの歯抜けを詰める */

  (Array.isArray(data.items) ? data.items : []).forEach(function(i){
    if(!i || typeof i.name !== 'string' || !i.name.trim()) return;
    var id = (typeof i.id === 'string' && i.id) ? i.id : 'i'+uid();
    if(okItem[id]) return;                      /* id重複を排除 */
    okItem[id] = true;
    var pc = (typeof i.purchaseCount === 'number' && isFinite(i.purchaseCount) && i.purchaseCount > 0)
      ? Math.floor(i.purchaseCount) : 0;
    out.items.push({
      id:id, name:i.name.trim(),
      /* 存在しないカテゴリを指していたら未分類に落とす */
      categoryId: (typeof i.categoryId === 'string' && okCat[i.categoryId]) ? i.categoryId : null,
      purchaseCount: pc,
      lastPurchasedAt: (typeof i.lastPurchasedAt === 'string' && i.lastPurchasedAt) ? i.lastPurchasedAt : null
    });
  });

  (Array.isArray(data.list) ? data.list : []).forEach(function(l){
    if(!l || typeof l.itemId !== 'string') return;
    if(!okItem[l.itemId]) return;               /* 存在しないアイテムを指す項目を除去 */
    if(inList[l.itemId]) return;                /* 同一アイテムの重複を排除 */
    inList[l.itemId] = true;
    out.list.push({
      itemId: l.itemId,
      /* 知らない優先度が入っていたら「ついで」に倒す */
      priority: PRIORITIES.indexOf(l.priority) >= 0 ? l.priority : 'anytime',
      checked: !!l.checked,
      addedAt: (typeof l.addedAt === 'string' && l.addedAt) ? l.addedAt : nowISO()
    });
  });

  /* セッションはチェック状態から導く。
     チェックがあるのにsessionが無い（または壊れている）場合は今から始まったことにする。 */
  if(out.list.some(function(l){ return l.checked; })){
    var s = data.session, at = s && s.startedAt;
    var valid = (typeof at === 'string') && !isNaN(new Date(at).getTime());
    out.session = {startedAt: valid ? at : nowISO()};
  }
  return out;
}

function load(){
  var raw;
  try { raw = localStorage.getItem(KEY); }
  catch(e){
    storageBlocked = true;
    state = seed();
    return;
  }
  if(!raw){ state = seed(); commitSilent(state); return; }

  var data;
  try { data = JSON.parse(raw); }
  catch(e){
    storageBlocked = true;
    state = seed();
    return;
  }

  if(typeof data.version === 'number' && data.version > VERSION){
    /* 新しいバージョンで保存されたデータ。
       知らないフィールドを落として上書きすると静かに壊れるので、読み込まない。 */
    document.body.innerHTML =
      '<div style="padding:40px 24px;font-family:-apple-system,sans-serif;line-height:1.9">'+
      '<h1 style="font-size:17px">読み込めないデータ</h1>'+
      '<p style="font-size:14px;color:#6B7370">保存されているデータは、このアプリより新しいバージョン'+
      '（v'+esc(data.version)+'）で作られている。<br>'+
      'データを壊さないため、読み込みを中止した。<br><br>'+
      '新しいほうのアプリを開くか、バックアップから戻してほしい。</p></div>';
    throw new Error('newer data version');
  }

  if(!data.version || data.version < VERSION) data = migrate(data);

  state = normalize(data);
  /* 正規化の結果はここでは書き戻さない。次の保存時に自然に反映される。
     読み込みは毎回この関数を通るので、書き戻さなくても表示は常に整合する。 */
}

function commitSilent(next){
  try { localStorage.setItem(KEY, JSON.stringify(next)); }
  catch(e){ storageBlocked = true; }
}

/* ================= lookups ================= */
function itemById(id){
  for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i];
  return null;
}
function catById(id){
  for(var i=0;i<state.categories.length;i++) if(state.categories[i].id===id) return state.categories[i];
  return null;
}
function catName(id){ var c = catById(id); return c ? c.name : UNCAT; }
function listEntry(itemId){
  for(var i=0;i<state.list.length;i++) if(state.list[i].itemId===itemId) return state.list[i];
  return null;
}
function sortedCategories(){
  return state.categories.slice().sort(function(a,b){ return a.order - b.order; });
}
function catOrder(id){
  var c = catById(id);
  return c ? c.order : 9999; /* 未分類は最後 */
}
function checkedCount(){
  return state.list.filter(function(l){ return l.checked; }).length;
}

/* 候補の並び順:
   購入実績のあるアイテムを購入回数の降順、同数なら最終購入日時の降順。
   未購入アイテムはその後ろ（名前順）。 */
function candidateSort(a,b){
  var ap = (a.purchaseCount||0) > 0, bp = (b.purchaseCount||0) > 0;
  if(ap !== bp) return ap ? -1 : 1;
  if(!ap) return a.name.localeCompare(b.name,'ja');
  if((b.purchaseCount||0) !== (a.purchaseCount||0)) return (b.purchaseCount||0) - (a.purchaseCount||0);
  return String(b.lastPurchasedAt||'').localeCompare(String(a.lastPurchasedAt||''));
}

/* ================= session =================
   開始 : チェック済みが 0 -> 1 になった時
   解除 : チェック済みが 0 に戻った時
   終了 : 「買い物終了」を押した時点で、未チェックが残っていても必ず null   */
function syncSession(next){
  var n = next.list.filter(function(l){ return l.checked; }).length;
  if(n > 0){
    if(!next.session) next.session = {startedAt: nowISO()};
  } else {
    next.session = null;
  }
}
function staleSession(){
  if(!state.session) return false;
  var d = new Date(state.session.startedAt);
  if(isNaN(d.getTime())) return false;
  return d.toDateString() !== new Date().toDateString();
}

/* ================= actions ================= */
function addToList(itemId, priority){
  if(listEntry(itemId)) return;
  var next = clone(state);
  next.list.push({itemId:itemId, priority:priority||'anytime', checked:false, addedAt:nowISO()});
  commit(next);
}
function removeFromList(itemId){
  var next = clone(state);
  next.list = next.list.filter(function(l){ return l.itemId !== itemId; });
  syncSession(next);
  commit(next);
}
function toggleList(itemId){
  if(listEntry(itemId)) removeFromList(itemId);
  else addToList(itemId);
}
function toggleCheck(itemId){
  var next = clone(state);
  next.list.forEach(function(l){ if(l.itemId===itemId) l.checked = !l.checked; });
  syncSession(next);
  commit(next);
}
function cyclePriority(itemId){
  var next = clone(state);
  next.list.forEach(function(l){
    if(l.itemId===itemId){
      var i = PRIORITIES.indexOf(l.priority);
      l.priority = PRIORITIES[(i+1) % PRIORITIES.length];
    }
  });
  commit(next);
}
function createItem(name, categoryId, addToListToo){
  var next = clone(state);
  var id = 'i'+uid();
  next.items.push({
    id:id, name:name,
    categoryId: categoryId || null,
    purchaseCount:0, lastPurchasedAt:null
  });
  if(addToListToo){
    next.list.push({itemId:id, priority:'anytime', checked:false, addedAt:nowISO()});
  }
  return commit(next) ? id : null;
}

/* 買い物終了：チェック済みだけを購入確定し、リストから外す。
   購入回数はここでのみ +1 する。未チェックは残す。セッションは必ず終了。 */
function finishShopping(){
  var next = clone(state);
  var stamp = nowISO();
  var done = {};
  next.list.forEach(function(l){ if(l.checked) done[l.itemId] = true; });
  if(Object.keys(done).length === 0) return;

  next.items.forEach(function(it){
    if(done[it.id]){
      it.purchaseCount = (it.purchaseCount||0) + 1;
      it.lastPurchasedAt = stamp;
    }
  });
  next.list = next.list.filter(function(l){ return !l.checked; });
  next.session = null;

  var n = Object.keys(done).length;
  if(commit(next)) toast(n + '件を購入済みにした');
}
function clearChecks(){
  var next = clone(state);
  next.list.forEach(function(l){ l.checked = false; });
  next.session = null;
  commit(next);
}

/* ================= render ================= */
function render(){
  document.querySelectorAll('.tab').forEach(function(t){
    t.setAttribute('aria-selected', t.dataset.view === view ? 'true' : 'false');
  });
  el('screen-list').classList.toggle('active', view==='list');
  el('screen-catalog').classList.toggle('active', view==='catalog');
  el('screen-settings').classList.toggle('active', view==='settings');

  document.querySelectorAll('#sort-seg button').forEach(function(b){
    b.setAttribute('aria-pressed', b.dataset.sort === sortMode ? 'true' : 'false');
  });

  renderSuggestions();
  renderModeNote();
  renderBanner();
  renderList();
  renderCatalog();
  renderSettings();
  renderFinish();
}

function renderSuggestions(){
  var box = el('suggestions');
  if(view !== 'list' || !query){ box.innerHTML=''; return; }

  var q = query.trim();
  if(!q){ box.innerHTML=''; return; }

  var hits = state.items.filter(function(i){ return i.name.indexOf(q) !== -1; }).sort(candidateSort);
  var exact = state.items.some(function(i){ return i.name === q; });

  var html = hits.slice(0,8).map(function(i){
    var inList = !!listEntry(i.id);
    return '<button class="sug'+(inList?' in-list':'')+'" data-sug="'+i.id+'">'+
      '<span class="sug-name">'+esc(i.name)+'</span>'+
      '<span class="sug-cat">'+(inList ? 'リストにある' : esc(catName(i.categoryId)))+'</span>'+
    '</button>';
  }).join('');

  if(!exact){
    html += '<button class="sug new" data-new="1">'+
      '<span class="sug-name">「'+esc(q)+'」を新しく登録</span>'+
      '<span class="sug-cat">カテゴリは後でよい</span></button>';
  }
  box.innerHTML = html;
}

function renderModeNote(){
  var box = el('mode-note');
  if(view !== 'list' || !browserMode){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="mode-note">'+
    '<b>Safariで開いている。</b><br>'+
    'ホーム画面のアプリとはデータが別になっている。'+
    'ここで登録したものはアプリ側には出てこない。'+
  '</div>';
}

function renderBanner(){
  var box = el('banner');
  if(view !== 'list' || !staleSession()){ box.innerHTML=''; return; }
  var n = checkedCount();
  box.innerHTML =
    '<div class="banner">'+
      '<div class="banner-text">前回のチェックが残っている（'+n+'件）</div>'+
      '<div class="banner-actions">'+
        '<button data-act="finish">買い物終了として確定</button>'+
        '<button data-act="clear">チェックを外す</button>'+
      '</div>'+
    '</div>';
}

function rowHTML(entry){
  var it = itemById(entry.itemId);
  if(!it) return '';
  return '<div class="row'+(entry.checked?' checked':'')+'">'+
    '<button class="badge" data-p="'+entry.priority+'" data-cycle="'+it.id+'" '+
      'aria-label="優先度 '+P_FULL[entry.priority]+'">'+P_LABEL[entry.priority]+'</button>'+
    '<button class="row-name" data-check="'+it.id+'">'+
      '<span class="check">✓</span>'+
      '<span class="row-label">'+esc(it.name)+'</span>'+
    '</button>'+
    '<button class="row-remove" data-unlist="'+it.id+'" aria-label="リストから外す">×</button>'+
  '</div>';
}

function renderList(){
  var box = el('list-body');
  if(view !== 'list') return;

  if(state.list.length === 0){
    box.innerHTML = browserMode
      ? '<div class="empty">このSafari側のリストは空。<br>'+
        'ホーム画面のアプリのデータは、こちらには出てこない。</div>'
      : '<div class="empty">リストは空。<br>上の欄にアイテム名を入れて追加する。</div>';
    return;
  }

  var groups = [];
  if(sortMode === 'priority'){
    PRIORITIES.forEach(function(p){
      var rows = state.list.filter(function(l){ return l.priority===p; });
      rows.sort(function(a,b){
        var ia = itemById(a.itemId), ib = itemById(b.itemId);
        var ca = catOrder(ia ? ia.categoryId : null), cb = catOrder(ib ? ib.categoryId : null);
        if(ca!==cb) return ca-cb;
        return String(a.addedAt).localeCompare(String(b.addedAt));
      });
      if(rows.length) groups.push({key:p, title:P_FULL[p], rows:rows});
    });
  } else {
    var cats = sortedCategories().concat([{id:null, name:UNCAT}]);
    cats.forEach(function(c){
      var rows = state.list.filter(function(l){
        var it = itemById(l.itemId);
        return it && (it.categoryId || null) === c.id;
      });
      rows.sort(function(a,b){
        var pa = PRIORITIES.indexOf(a.priority), pb = PRIORITIES.indexOf(b.priority);
        if(pa!==pb) return pa-pb;
        return String(a.addedAt).localeCompare(String(b.addedAt));
      });
      if(rows.length) groups.push({key:'cat', title:c.name, rows:rows});
    });
  }

  box.innerHTML = groups.map(function(g){
    return '<div class="group'+(g.key==='now'?' p-now':'')+'">'+
      '<div class="group-head">'+esc(g.title)+'<span class="count">'+g.rows.length+'</span></div>'+
      '<div class="rows">'+g.rows.map(rowHTML).join('')+'</div>'+
    '</div>';
  }).join('');
}

function renderCatalog(){
  var box = el('catalog-body');
  if(view !== 'catalog') return;

  if(state.items.length === 0){
    box.innerHTML = '<div class="empty">まだアイテムが無い。<br>リスト画面で追加すると、ここに貯まっていく。</div>';
    return;
  }

  var cats = sortedCategories().concat([{id:null, name:UNCAT}]);
  var html = cats.map(function(c){
    var items = state.items.filter(function(i){ return (i.categoryId||null) === c.id; }).sort(candidateSort);
    if(!items.length) return '';
    return '<div class="group">'+
      '<div class="group-head">'+esc(c.name)+'<span class="count">'+items.length+'</span></div>'+
      '<div class="rows">'+ items.map(function(i){
        var inList = !!listEntry(i.id);
        return '<div class="cat-row'+(inList?' in-list':'')+'">'+
          '<button class="cat-toggle" data-toggle="'+i.id+'">'+
            '<span class="dot"></span><span class="cat-label">'+esc(i.name)+'</span>'+
          '</button>'+
          '<button class="cat-edit" data-edit="'+i.id+'" aria-label="編集">編集</button>'+
        '</div>';
      }).join('') +'</div></div>';
  }).join('');

  box.innerHTML = html + '<p class="note">タップでリストに入れたり外したりできる。'+
    '並び順は、よく買うものが上。</p>';
}

function renderSettings(){
  if(view !== 'settings') return;
  var cats = sortedCategories();
  el('category-body').innerHTML = cats.length ? cats.map(function(c,idx){
    return '<div class="set-row">'+
      '<span class="set-name">'+esc(c.name)+'</span>'+
      '<button class="icon-btn" data-cup="'+c.id+'" '+(idx===0?'disabled':'')+' aria-label="上へ">↑</button>'+
      '<button class="icon-btn" data-cdown="'+c.id+'" '+(idx===cats.length-1?'disabled':'')+' aria-label="下へ">↓</button>'+
      '<button class="icon-btn" data-crename="'+c.id+'" aria-label="名前を変える">改名</button>'+
      '<button class="icon-btn" data-cdel="'+c.id+'" aria-label="削除">×</button>'+
    '</div>';
  }).join('') : '<div class="empty">カテゴリが無い。すべて未分類として扱われる。</div>';

  var stale = storageBlocked ? '<br><strong style="color:#B4451F">このブラウザではデータを保存できていない。'+
    'プライベートブラウズを解除するか、別のブラウザで開いてほしい。</strong>' : '';
  var mode = browserMode
    ? '<br><strong style="color:#8A6A1F">今はSafariで開いている。'+
      'ホーム画面のアプリとはデータが別。</strong>'
    : '';
  el('about-note').innerHTML =
    'かいものリスト v'+APP_VERSION+'（'+APP_DATE+'）<br>'+
    'アイテム '+state.items.length+' 件 / リスト '+state.list.length+' 件<br>'+
    'データ形式 v'+VERSION+'（この端末のブラウザ内にだけ保存される。端末をまたいだ同期はしない）'+ mode + stale;
}

function renderFinish(){
  var bar = el('finish');
  var n = checkedCount();
  var show = (view === 'list' && n > 0);
  bar.classList.toggle('show', show);
  if(show) el('finish-btn').textContent = '買い物終了（'+n+'件）';
}

/* ================= dialogs ================= */
function openSheet(html){
  el('sheet').innerHTML = html;
  el('overlay').classList.add('show');
}
function closeSheet(){
  el('overlay').classList.remove('show');
  el('sheet').innerHTML = '';
}

function categoryOptions(selected){
  var opts = '<option value="">'+UNCAT+'</option>';
  sortedCategories().forEach(function(c){
    opts += '<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>';
  });
  return opts;
}

function openItemEditor(itemId){
  var it = itemById(itemId);
  if(!it) return;
  var inList = !!listEntry(itemId);
  openSheet(
    '<h2>アイテムを編集</h2>'+
    '<div class="field"><label for="ed-name">名前</label>'+
      '<input id="ed-name" type="text" value="'+esc(it.name)+'"></div>'+
    '<div class="field"><label for="ed-cat">カテゴリ</label>'+
      '<select id="ed-cat">'+categoryOptions(it.categoryId)+'</select></div>'+
    '<button class="btn primary" data-act="save-item" data-id="'+itemId+'">保存する</button>'+
    '<button class="btn danger" data-act="del-item" data-id="'+itemId+'">'+
      (inList ? 'リストから外して削除' : 'このアイテムを削除') +'</button>'+
    '<button class="btn" data-act="close">やめる</button>'
  );
}

function saveItem(itemId){
  var name = el('ed-name').value.trim();
  var cat = el('ed-cat').value || null;
  if(!name){ toast('名前を入れてほしい'); return; }
  var next = clone(state);
  next.items.forEach(function(i){
    if(i.id===itemId){ i.name = name; i.categoryId = cat; }
  });
  if(commit(next)) closeSheet();
}

function confirmDeleteItem(itemId){
  var it = itemById(itemId);
  if(!it) return;
  var inList = !!listEntry(itemId);
  openSheet(
    '<h2>'+esc(it.name)+'を削除する</h2>'+
    '<p>'+
      (inList ? 'このアイテムは今の買い物リストに入っている。削除すると、リストからも外れる。<br>' : '')+
      '購入回数の記録も一緒に消える。'+
    '</p>'+
    '<button class="btn danger" data-act="del-item-go" data-id="'+itemId+'">'+
      (inList ? 'リストから外して削除' : '削除する') +'</button>'+
    '<button class="btn" data-act="close">やめる</button>'
  );
}

function deleteItem(itemId){
  var next = clone(state);
  next.items = next.items.filter(function(i){ return i.id !== itemId; });
  next.list  = next.list.filter(function(l){ return l.itemId !== itemId; });
  syncSession(next);
  if(commit(next)) closeSheet();
}

function openCategoryEditor(catId){
  var c = catId ? catById(catId) : null;
  openSheet(
    '<h2>'+(c ? 'カテゴリの名前を変える' : 'カテゴリを追加')+'</h2>'+
    '<div class="field"><label for="cat-name">名前</label>'+
      '<input id="cat-name" type="text" value="'+(c?esc(c.name):'')+'" placeholder="日用品 など"></div>'+
    '<button class="btn primary" data-act="save-cat" data-id="'+(catId||'')+'">保存する</button>'+
    '<button class="btn" data-act="close">やめる</button>'
  );
  setTimeout(function(){ var i = el('cat-name'); if(i) i.focus(); }, 50);
}

function saveCategory(catId){
  var name = el('cat-name').value.trim();
  if(!name){ toast('名前を入れてほしい'); return; }
  var next = clone(state);
  if(catId){
    next.categories.forEach(function(c){ if(c.id===catId) c.name = name; });
  } else {
    var max = -1;
    next.categories.forEach(function(c){ if(c.order > max) max = c.order; });
    next.categories.push({id:'c'+uid(), name:name, order:max+1});
  }
  if(commit(next)) closeSheet();
}

function confirmDeleteCategory(catId){
  var c = catById(catId);
  if(!c) return;
  var n = state.items.filter(function(i){ return i.categoryId === catId; }).length;
  openSheet(
    '<h2>'+esc(c.name)+'を削除する</h2>'+
    '<p>'+(n ? 'このカテゴリの'+n+'件は'+UNCAT+'に移る。アイテム自体は消えない。' : 'このカテゴリにアイテムは無い。')+'</p>'+
    '<button class="btn danger" data-act="del-cat-go" data-id="'+catId+'">削除する</button>'+
    '<button class="btn" data-act="close">やめる</button>'
  );
}

function deleteCategory(catId){
  var next = clone(state);
  next.categories = next.categories.filter(function(c){ return c.id !== catId; });
  next.items.forEach(function(i){ if(i.categoryId === catId) i.categoryId = null; });
  next.categories.sort(function(a,b){ return a.order-b.order; })
    .forEach(function(c,i){ c.order = i; });
  if(commit(next)) closeSheet();
}

function moveCategory(catId, dir){
  var next = clone(state);
  var cats = next.categories.sort(function(a,b){ return a.order-b.order; });
  var idx = -1;
  cats.forEach(function(c,i){ if(c.id===catId) idx = i; });
  var j = idx + dir;
  if(idx < 0 || j < 0 || j >= cats.length) return;
  var tmp = cats[idx]; cats[idx] = cats[j]; cats[j] = tmp;
  cats.forEach(function(c,i){ c.order = i; });
  commit(next);
}

/* ================= export / import ================= */
function download(filename, text, mime){
  var blob = new Blob([text], {type: mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function stamp(){
  var d = new Date(), p = function(n){ return ('0'+n).slice(-2); };
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}
function exportJSON(){
  /* 書き出したJSONにアプリ版を残す。手元に届いたファイルから
     どの版で作られたかを辿れるようにするため。読み込み時には使わない。 */
  var out = clone(state);
  out.appVersion = APP_VERSION;
  out.exportedAt = nowISO();
  download('kaimono-'+stamp()+'.json', JSON.stringify(out, null, 2), 'application/json');
}
function csvCell(v){
  var s = (v===null || v===undefined) ? '' : String(v);
  return '"' + s.replace(/"/g,'""') + '"';
}
/* 購入回数と最終購入日は画面には一切出さないが、JSONとCSVには出す。
   「UIに出さない」と「データとして外部出力しない」は別のこと。
   JSONは完全なバックアップ、CSVは人が見て加工するためのもの。
   なお lastPurchasedAt は日付を1つしか持たないので、これ自体は履歴にならない。 */
function exportCSV(){
  var head = ['カテゴリ','アイテム名','購入回数','最終購入日','リスト','優先度','チェック'];
  var rows = [head.map(csvCell).join(',')];
  var cats = sortedCategories().concat([{id:null, name:UNCAT}]);
  cats.forEach(function(c){
    state.items.filter(function(i){ return (i.categoryId||null)===c.id; })
      .sort(candidateSort)
      .forEach(function(i){
        var e = listEntry(i.id);
        rows.push([
          c.name, i.name, i.purchaseCount||0,
          i.lastPurchasedAt ? i.lastPurchasedAt.slice(0,10) : '',
          e ? 'あり' : '', e ? P_FULL[e.priority] : '', (e && e.checked) ? '済' : ''
        ].map(csvCell).join(','));
      });
  });
  download('kaimono-'+stamp()+'.csv', '\uFEFF' + rows.join('\r\n'), 'text/csv');
}
function importJSON(text){
  var data;
  try { data = JSON.parse(text); }
  catch(e){ toast('JSONとして読めなかった'); return; }
  if(!data || !Array.isArray(data.items) || !Array.isArray(data.categories)){
    toast('このアプリのデータ形式ではないみたい'); return;
  }
  if(typeof data.version === 'number' && data.version > VERSION){
    toast('新しいバージョンのデータなので読み込めない'); return;
  }
  if(!data.version || data.version < VERSION) data = migrate(data);

  /* 起動時の読み込みと同じ正規化を通す */
  var next = normalize(data);
  if(commit(next)) toast('アイテム'+next.items.length+'件を読み込んだ');
}

/* ================= events ================= */
document.querySelector('.tabs').addEventListener('click', function(e){
  var b = e.target.closest('[data-view]');
  if(!b) return;
  view = b.dataset.view;
  render();
  window.scrollTo(0,0);
});

el('sort-seg').addEventListener('click', function(e){
  var b = e.target.closest('[data-sort]');
  if(!b) return;
  sortMode = b.dataset.sort;
  render();
});

var search = el('search');
search.addEventListener('input', function(){
  query = search.value;
  el('search-clear').classList.toggle('show', !!query);
  renderSuggestions();
});
el('search-clear').addEventListener('click', function(){ resetSearch(); });
search.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  var q = query.trim();
  if(!q) return;
  var hit = null;
  state.items.forEach(function(i){ if(i.name === q) hit = i; });
  if(hit){
    if(!listEntry(hit.id)) addToList(hit.id);
    resetSearch();
  } else {
    if(createItem(q, null, true)) resetSearch();
  }
});
function resetSearch(){
  query = ''; search.value = '';
  el('search-clear').classList.remove('show');
  renderSuggestions();
  /* 候補タップで追加した場合、フォーカスはボタン側に移っている。
     入力欄に戻さないと、棚の前で連続して追加できない。 */
  search.focus();
}

el('suggestions').addEventListener('click', function(e){
  var s = e.target.closest('[data-sug]');
  if(s){
    var id = s.dataset.sug;
    if(!listEntry(id)) addToList(id);
    resetSearch();
    return;
  }
  var n = e.target.closest('[data-new]');
  if(n){
    if(createItem(query.trim(), null, true)) resetSearch();
  }
});

el('banner').addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  if(b.dataset.act === 'finish') finishShopping();
  if(b.dataset.act === 'clear') clearChecks();
});

el('list-body').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.cycle)  return cyclePriority(b.dataset.cycle);
  if(b.dataset.check)  return toggleCheck(b.dataset.check);
  if(b.dataset.unlist) return removeFromList(b.dataset.unlist);
});

el('catalog-body').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.toggle) return toggleList(b.dataset.toggle);
  if(b.dataset.edit)   return openItemEditor(b.dataset.edit);
});

el('finish-btn').addEventListener('click', finishShopping);

el('category-body').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(!b || b.disabled) return;
  if(b.dataset.cup)     return moveCategory(b.dataset.cup, -1);
  if(b.dataset.cdown)   return moveCategory(b.dataset.cdown, 1);
  if(b.dataset.crename) return openCategoryEditor(b.dataset.crename);
  if(b.dataset.cdel)    return confirmDeleteCategory(b.dataset.cdel);
});
el('add-category').addEventListener('click', function(){ openCategoryEditor(null); });

el('export-json').addEventListener('click', exportJSON);
el('export-csv').addEventListener('click', exportCSV);
el('import-json').addEventListener('click', function(){ el('import-file').click(); });
el('import-file').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){ importJSON(String(r.result)); };
  r.onerror = function(){ toast('ファイルを読めなかった'); };
  r.readAsText(f);
  e.target.value = '';
});

el('overlay').addEventListener('click', function(e){
  if(e.target === el('overlay')) return closeSheet();
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if(act === 'close')        return closeSheet();
  if(act === 'save-item')    return saveItem(id);
  if(act === 'del-item')     return confirmDeleteItem(id);
  if(act === 'del-item-go')  return deleteItem(id);
  if(act === 'save-cat')     return saveCategory(id || null);
  if(act === 'del-cat-go')   return deleteCategory(id);
});

/* ================= boot ================= */
load();
render();
if(storageBlocked) toast('このブラウザではデータを保存できない');

})();
</script>
</body>
</html>
